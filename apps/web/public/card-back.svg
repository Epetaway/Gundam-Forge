<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="300" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2044"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="300" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="hexPat" x="0" y="0" width="36" height="40" patternUnits="userSpaceOnUse">
      <polygon points="18,2 34,11 34,29 18,38 2,29 2,11" fill="none" stroke="#1d4ed8" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c1829" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="url(#bgGrad)" rx="8"/>

  <!-- Hex pattern -->
  <rect width="300" height="420" fill="url(#hexPat)" rx="8"/>

  <!-- Center glow -->
  <ellipse cx="150" cy="210" rx="130" ry="140" fill="url(#glowCenter)"/>

  <!-- Outer border -->
  <rect x="6" y="6" width="288" height="408" rx="6" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Inner border -->
  <rect x="14" y="14" width="272" height="392" rx="4" fill="none" stroke="#1d4ed8" stroke-width="0.5" opacity="0.5"/>

  <!-- Corner marks TL -->
  <polyline points="14,40 14,14 40,14" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <!-- Corner marks TR -->
  <polyline points="260,14 286,14 286,40" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <!-- Corner marks BL -->
  <polyline points="14,380 14,406 40,406" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <!-- Corner marks BR -->
  <polyline points="260,406 286,406 286,380" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>

  <!-- Diamond emblem center -->
  <polygon points="150,148 178,210 150,272 122,210" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <polygon points="150,162 168,210 150,258 132,210" fill="#1d4ed8" opacity="0.18"/>

  <!-- GF monogram -->
  <text x="150" y="204" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#3b82f6" opacity="0.55" letter-spacing="6">GF</text>

  <!-- Subtitle -->
  <text x="150" y="232" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="middle" fill="#60a5fa" opacity="0.45" letter-spacing="3">GUNDAM FORGE</text>

  <!-- Horizontal rule lines -->
  <line x1="40" y1="175" x2="110" y2="175" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
  <line x1="190" y1="175" x2="260" y2="175" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
  <line x1="40" y1="245" x2="110" y2="245" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
  <line x1="190" y1="245" x2="260" y2="245" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
</svg>
