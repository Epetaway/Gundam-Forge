name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: QA gate (lint + build)
        run: npm run qa

      - name: Download card images
        run: npm run fetch-assets
        env:
          # Skip live price lookups in CI — use the prices already in cards.json.
          USE_MOCK_PRICES: 'true'

      - name: Build project
        run: npm --workspace @gundam-forge/web run build
        env:
          NEXT_OUTPUT_MODE: 'export'
          NEXT_PUBLIC_BASE_PATH: '/Gundam-Forge'

      - name: Validate export artifact
        run: |
          test -d apps/web/out
          test -f apps/web/out/index.html
          test -f apps/web/out/404.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
